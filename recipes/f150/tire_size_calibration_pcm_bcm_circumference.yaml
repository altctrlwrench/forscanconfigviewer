steps:
- module: BCM
  address: 726-15-01
  mask: xxxx-xxxx-AB--
  type: continuous
  unit: mm
  instruction: First two digits of tire circumference in MM encoded in hex.  Check
    speed vs GPS, then tweak to correct speedometer with GSP speed
- module: BCM
  address: 726-15-02
  mask: CDxx-xx--
  type: continuous
  unit: mm
  instruction: First two digits of tire circumference in MM encoded in hex.  Check
    speed vs GPS, then tweak to correct speedometer with GSP speed
