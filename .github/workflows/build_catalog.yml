name: Build Recipe Catalog

on:
  push:
    branches: [ main ]
    paths:
      - 'recipes/**'
      - 'scripts/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'recipes/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pyyaml

      - name: Compile Master Recipe Catalog
        run: |
          python scripts/compile_catalog.py

      - name: Commit & Push Changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/master_recipes.json
          git diff-index --quiet HEAD || git commit -m "chore(catalog): auto-compile master_recipes.json [skip ci]"
          git push
